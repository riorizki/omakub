name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: git ls-files '*.sh' bin/omakub defaults/bash/{aliases,functions,init,prompt,rc,sdks,shell} | xargs -n1 bash -n

      - name: Run ShellCheck for errors
        run: git ls-files '*.sh' bin/omakub defaults/bash/{aliases,functions,init,prompt,rc,sdks,shell} | xargs shellcheck -S error -s bash

  apt-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - name: Check installer packages are available
        run: |
          apt-get update
          bash test/apt-packages.sh
